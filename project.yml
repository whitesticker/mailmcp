name: MailMCP
options:
  bundleIdPrefix: com.mailmcp
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail
    revision: dbb1d0bb6bc7742249cf4800513c5562d54fa734
targets:
  MailMCP:
    type: application
    platform: macOS
    sources:
      - MailMCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mailmcp.app
        PRODUCT_NAME: MailMCP
        INFOPLIST_FILE: MailMCP/Info.plist
        CODE_SIGN_ENTITLEMENTS: MailMCP/MailMCP.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "5"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: MailMCP/MailMCP.entitlements
    dependencies:
      - target: mailmcp-mcp
      - package: SwiftMail
        product: SwiftMail
    postBuildScripts:
      - name: Embed mailmcp-mcp
        script: |
          set -euo pipefail
          SRC="${BUILT_PRODUCTS_DIR}/mailmcp-mcp"
          DEST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/mailmcp-mcp"
          if [ -x "${SRC}" ]; then
            cp -f "${SRC}" "${DEST}"
            chmod +x "${DEST}"
          fi
  mailmcp-mcp:
    type: tool
    platform: macOS
    sources:
      - path: MailMCP
        excludes:
          - MailMCPApp.swift
          - Views/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mailmcp.mcp
        PRODUCT_NAME: mailmcp-mcp
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: MAILMCP_CLI
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SwiftMail
        product: SwiftMail
  MailMCPTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MailMCPTests
    dependencies:
      - target: MailMCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mailmcp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MailMCP.app/Contents/MacOS/MailMCP"
        BUNDLE_LOADER: "$(TEST_HOST)"
